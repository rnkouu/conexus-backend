version: '3.8'

services:
  ojs:
    image: pkpofficial/ojs:latest
    ports:
      - "8080:80"
    environment:
      - SERVERNAME=conexus-ojs.up.railway.app
      - OJS_DB_DRIVER=postgres
      - OJS_DB_HOST=db
      - OJS_DB_USERNAME=ojs_user
      - OJS_DB_PASSWORD=your_secure_password
      - OJS_DB_NAME=ojs_db
    volumes:
      - ojs-data:/var/www/html/public
      - ojs-files:/var/www/files
    depends_on:
      - db
    networks:
      - conexus-network
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=ojs_db
      - POSTGRES_USER=ojs_user
      - POSTGRES_PASSWORD=your_secure_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - conexus-network
    restart: unless-stopped

networks:
  conexus-network:
    driver: bridge

volumes:
  ojs-data:
  ojs-files:
  db-data: